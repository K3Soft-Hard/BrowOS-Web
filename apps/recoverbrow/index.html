<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BrowChat</title>
	<link rel="stylesheet" href="style.css">
	<script src="../shared/theme.js"></script>
	<script src="../../sdk/browos-sdk.js"></script>
</head>
<body>
	<div class="app-shell">
		<!-- Sidebar: Chat History -->
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-top">
				<button type="button" class="btn primary full" id="newChatBtn">+ New Chat</button>
			</div>

			<div class="sidebar-search">
				<input type="text" id="historySearch" placeholder="Filter chats..." autocomplete="off">
			</div>

			<div class="chat-list" id="chatList"></div>

			<div class="sidebar-footer">
				<button type="button" class="btn ghost full" id="openProvidersBtn">Providers &amp; Models</button>
				<button type="button" class="btn ghost full" id="openSkillsBtn">Skills &amp; Bubble</button>
			</div>
		</aside>

		<!-- Main Workspace -->
		<main class="main-area">
			<header class="topbar">
				<div class="topbar-left">
					<button type="button" class="btn icon-only" id="toggleSidebarBtn" title="Toggle sidebar" aria-label="Toggle sidebar">
						<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
					</button>

					<select id="modelSelect" aria-label="Select model"></select>

					<!-- Multi-Skill Picker Popover Trigger -->
					<div class="skills-picker-wrap">
						<button type="button" class="btn" id="skillsDropdownBtn">Skills (0)</button>
						<div class="skills-popover" id="skillsPopover" hidden>
							<div class="skills-popover-head">
								<span>Active Skills</span>
								<button type="button" class="link-btn" id="disableAllSkillsBtn">Disable All</button>
							</div>
							<div class="skills-popover-list" id="skillsPopoverList"></div>
							<div class="skills-popover-foot">
								<button type="button" class="btn full" id="manageSkillsFromPopoverBtn">Manage Skills</button>
							</div>
						</div>
					</div>
				</div>

				<div class="topbar-right">
					<button type="button" class="btn" id="syncBubbleBtn" title="Push mini-chat card to BrowOS Bubble">Bubble</button>
					<button type="button" class="btn" id="exportMdBtn" title="Export chat as Markdown">Export MD</button>
					<button type="button" class="btn" id="exportJsonBtn" title="Export chat as JSON">JSON</button>
				</div>
			</header>

			<!-- Messages Feed -->
			<section class="messages" id="messagesContainer" aria-live="polite"></section>

			<!-- Composer -->
			<footer class="composer-wrap">
				<div class="attachments-bar" id="attachmentsBar" hidden></div>

				<div class="composer-box">
					<textarea id="promptInput" rows="1" placeholder="Message BrowChat..." spellcheck="true"></textarea>

					<div class="composer-toolbar">
						<div class="composer-tools-left">
							<button type="button" class="chip-btn" id="attachFileBtn" title="Attach file from BrowOS Files or device">
								<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
								<span>Attach</span>
							</button>
							<input type="file" id="hiddenFileInput" multiple hidden>

							<button type="button" class="chip-btn" id="webSearchToggleBtn" title="Enable server-side web search">
								<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
								<span>Web Search</span>
							</button>
						</div>

						<div class="composer-tools-right">
							<button type="button" class="btn danger" id="stopBtn" hidden>Stop</button>
							<button type="button" class="btn primary" id="sendBtn">Send</button>
						</div>
					</div>
				</div>
			</footer>
		</main>
	</div>

	<!-- Modal: Providers Manager (Starts Empty -> + Add Provider -> Manage Added List) -->
	<div class="modal-backdrop" id="providersModal" hidden>
		<div class="modal-card">
			<div class="modal-header">
				<h2 id="providersModalTitle">Providers &amp; Models</h2>
				<button type="button" class="btn icon-only" data-close-modal="providersModal">×</button>
			</div>

			<div class="modal-body">
				<!-- View A: List of Added Providers -->
				<div id="providersListView" class="view-stack">
					<div class="field-row" style="justify-content:space-between;">
						<span class="status-text">Added providers appear in your model selector.</span>
						<button type="button" class="btn primary" id="showAddProviderFormBtn">+ Add Provider</button>
					</div>

					<div class="added-providers-list" id="addedProvidersList"></div>
				</div>

				<!-- View B: Add / Edit Provider Form -->
				<div id="providerEditorView" class="view-stack" hidden>
					<div class="field-col">
						<label for="provTypeSelect">Provider type</label>
						<select id="provTypeSelect">
							<option value="openrouter">OpenRouter</option>
							<option value="gemini">Google Gemini</option>
							<option value="groq">Groq</option>
							<option value="openai">OpenAI / Compatible</option>
							<option value="ollama">Ollama (Local)</option>
						</select>
					</div>

					<div class="field-col">
						<label for="provNameInput">Display name</label>
						<input type="text" id="provNameInput" placeholder="e.g. OpenRouter">
					</div>

					<div class="field-col">
						<label for="provBaseUrlInput">API Base URL</label>
						<input type="text" id="provBaseUrlInput" placeholder="https://openrouter.ai/api/v1">
					</div>

					<div class="field-col">
						<label for="provApiKeyInput">API Key</label>
						<input type="password" id="provApiKeyInput" placeholder="Paste API key (optional for local Ollama)" autocomplete="off">
					</div>

					<div class="field-row">
						<button type="button" class="btn" id="fetchProviderModelsBtn">Fetch Live Models</button>
						<span class="status-text" id="providerFormStatus"></span>
					</div>

					<div class="field-col">
						<label for="customModelIdInput">Add model ID manually</label>
						<div class="field-row">
							<input type="text" id="customModelIdInput" placeholder="e.g. openrouter/free or anthropic/claude-sonnet-4">
							<button type="button" class="btn" id="addManualModelBtn">Add</button>
						</div>
					</div>

					<div class="field-col">
						<div class="field-row" style="justify-content:space-between;">
							<label>Select models to show</label>
							<input type="text" id="searchProviderModelsInput" placeholder="Search models..." style="max-width:200px;">
						</div>
						<div class="models-checklist" id="providerModelsChecklist"></div>
					</div>

					<div class="field-row" style="justify-content:flex-end;margin-top:4px;">
						<button type="button" class="btn" id="cancelProviderFormBtn">Back</button>
						<button type="button" class="btn primary" id="saveProviderFormBtn">Save Provider</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal: Skills & BrowOS Bubble Settings -->
	<div class="modal-backdrop" id="skillsModal" hidden>
		<div class="modal-card">
			<div class="modal-header">
				<h2>Skills &amp; BrowOS Bubble</h2>
				<button type="button" class="btn icon-only" data-close-modal="skillsModal">×</button>
			</div>

			<div class="modal-body">
				<h3>BrowOS Bubble Mini-Chat</h3>
				<div class="field-row">
					<label for="bubbleAutoSyncToggle">Keep BrowChat card active in BrowOS Bubble</label>
					<input type="checkbox" id="bubbleAutoSyncToggle" checked>
				</div>

				<div class="field-col">
					<label for="bubblePresetsInput">Quick prompt presets for Bubble (comma-separated)</label>
					<input type="text" id="bubblePresetsInput" placeholder="Summarize this, Explain simply, Fix my code">
				</div>

				<div class="field-row">
					<button type="button" class="btn primary" id="saveBubblePrefsBtn">Update Bubble Card</button>
					<button type="button" class="btn" id="hideBubbleCardBtn">Hide from Bubble</button>
				</div>

				<hr class="divider">

				<div class="field-row" style="justify-content:space-between;">
					<h3>Skills (Combine Multiple or Disable All)</h3>
					<div style="display:flex;gap:6px;">
						<button type="button" class="btn" id="disableAllSkillsModalBtn">Disable All</button>
						<button type="button" class="btn" id="uploadSkillBtn">Upload (.md / .txt)</button>
						<input type="file" id="skillFileInput" accept=".md,.txt,.json,text/*" hidden>
						<button type="button" class="btn primary" id="newSkillBtn">+ New Skill</button>
					</div>
				</div>

				<div class="skills-list" id="skillsList"></div>

				<div class="skill-editor" id="skillEditor" hidden>
					<input type="text" id="skillNameInput" placeholder="Skill name (e.g. Code Reviewer)">
					<textarea id="skillPromptInput" rows="5" placeholder="Write system instructions or rules for this skill..."></textarea>
					<div class="field-row" style="justify-content:flex-end;">
						<button type="button" class="btn" id="cancelSkillBtn">Cancel</button>
						<button type="button" class="btn primary" id="saveSkillBtn">Save Skill</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
