<!DOCTYPE html>
<html lang="en" data-theme="cyber-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calculator with scientific functions and unit conversions.">
  <title>Calculator</title>
  <link rel="stylesheet" href="simple.css">
</head>
<body>
  <main class="calculator-app">
    <header class="app-header">
      <h1>Calculator</h1>
      <div class="header-controls">
        <button id="soundToggle" class="quiet-button" type="button" title="Toggle button sounds" aria-label="Toggle button sounds">Sound</button>
        <div class="theme-selector-wrapper">
          <button id="themeDropdownBtn" class="quiet-button" type="button" title="Choose a color theme">Theme</button>
          <div id="themeMenu" class="theme-menu">
            <button class="theme-opt" data-theme-val="cyber-dark" type="button">Dark</button>
            <button class="theme-opt" data-theme-val="aurora-glass" type="button">Violet</button>
            <button class="theme-opt" data-theme-val="midnight-oled" type="button">Black</button>
            <button class="theme-opt" data-theme-val="platinum-light" type="button">Light</button>
          </div>
        </div>
        <button id="historyToggle" class="quiet-button" type="button" aria-label="Toggle history">History</button>
        <button id="shortcutsBtn" class="quiet-button" type="button" aria-label="Keyboard shortcuts">Keys</button>
      </div>
    </header>

    <div class="calc-container">
      <section class="calc-main-card" aria-label="Calculator">
        <nav class="mode-tabs" role="tablist" aria-label="Calculator mode">
          <button class="mode-tab active" data-mode="standard" role="tab" aria-selected="true" type="button">Standard</button>
          <button class="mode-tab" data-mode="scientific" role="tab" aria-selected="false" type="button">Scientific</button>
          <button class="mode-tab" data-mode="converter" role="tab" aria-selected="false" type="button">Convert</button>
        </nav>

        <div class="display-screen" aria-live="polite">
          <div class="display-status-bar">
            <span class="angle-mode-badge" id="angleModeBadge">DEG</span>
            <span class="memory-badge" id="memoryBadge" hidden>M</span>
            <button id="copyBtn" class="copy-display-btn" type="button" title="Copy result">Copy</button>
          </div>
          <div class="expression-line" id="expressionDisplay"></div>
          <div class="output-line" id="outputDisplay">0</div>
          <div class="preview-line" id="previewDisplay"></div>
        </div>

        <div class="memory-bar" aria-label="Memory">
          <button class="mem-btn" data-action="mc" type="button">MC</button>
          <button class="mem-btn" data-action="mr" type="button">MR</button>
          <button class="mem-btn" data-action="m-plus" type="button">M+</button>
          <button class="mem-btn" data-action="m-minus" type="button">M−</button>
          <button class="mem-btn" data-action="ms" type="button">MS</button>
        </div>

        <div class="scientific-keypad" id="scientificKeypad">
          <button class="key sc-key" data-action="toggle-angle" id="angleToggleBtn" type="button">RAD</button>
          <button class="key sc-key" data-func="sin" type="button">sin</button>
          <button class="key sc-key" data-func="cos" type="button">cos</button>
          <button class="key sc-key" data-func="tan" type="button">tan</button>
          <button class="key sc-key" data-func="pi" type="button">π</button>
          <button class="key sc-key" data-func="sqrt" type="button">√x</button>
          <button class="key sc-key" data-func="pow2" type="button">x²</button>
          <button class="key sc-key" data-op="^" type="button">xʸ</button>
          <button class="key sc-key" data-func="log" type="button">log</button>
          <button class="key sc-key" data-func="ln" type="button">ln</button>
          <button class="key sc-key" data-func="inv" type="button">1/x</button>
          <button class="key sc-key" data-func="fact" type="button">n!</button>
          <button class="key sc-key" data-func="e" type="button">e</button>
          <button class="key sc-key" data-val="(" type="button">(</button>
          <button class="key sc-key" data-val=")" type="button">)</button>
        </div>

        <div class="standard-keypad" id="standardKeypad">
          <button class="key fn-key clear-key" data-action="clear-all" type="button">AC</button>
          <button class="key fn-key" data-action="backspace" type="button">⌫</button>
          <button class="key fn-key" data-action="percent" type="button">%</button>
          <button class="key op-key" data-op="/" type="button">÷</button>
          <button class="key num-key" data-val="7" type="button">7</button>
          <button class="key num-key" data-val="8" type="button">8</button>
          <button class="key num-key" data-val="9" type="button">9</button>
          <button class="key op-key" data-op="*" type="button">×</button>
          <button class="key num-key" data-val="4" type="button">4</button>
          <button class="key num-key" data-val="5" type="button">5</button>
          <button class="key num-key" data-val="6" type="button">6</button>
          <button class="key op-key" data-op="-" type="button">−</button>
          <button class="key num-key" data-val="1" type="button">1</button>
          <button class="key num-key" data-val="2" type="button">2</button>
          <button class="key num-key" data-val="3" type="button">3</button>
          <button class="key op-key" data-op="+" type="button">+</button>
          <button class="key fn-key" data-action="negate" type="button">±</button>
          <button class="key num-key" data-val="0" type="button">0</button>
          <button class="key num-key" data-val="." type="button">.</button>
          <button class="key equals-key" data-action="equals" type="button">=</button>
        </div>

        <div class="converter-panel" id="converterPanel" style="display: none;">
          <div class="converter-category-tabs">
            <button class="conv-tab active" data-conv="length" type="button">Length</button>
            <button class="conv-tab" data-conv="weight" type="button">Weight</button>
            <button class="conv-tab" data-conv="temp" type="button">Temp</button>
            <button class="conv-tab" data-conv="data" type="button">Storage</button>
          </div>
          <div class="converter-box">
            <label class="conv-row" for="convFromVal">From
              <div class="conv-input-group"><input type="number" id="convFromVal" value="1" step="any"><select id="convFromUnit" aria-label="From unit"></select></div>
            </label>
            <div class="conv-divider"><button id="convSwapBtn" class="conv-swap-btn" type="button" title="Swap units">Swap</button></div>
            <label class="conv-row" for="convToVal">To
              <div class="conv-input-group"><input type="number" id="convToVal" readonly><select id="convToUnit" aria-label="To unit"></select></div>
            </label>
            <div class="conv-formula-display" id="convFormulaDisplay"></div>
          </div>
        </div>
      </section>

      <aside class="calc-history-drawer" id="historyDrawer">
        <div class="history-header"><h2>History</h2><button id="clearHistoryBtn" class="quiet-button" type="button">Clear</button></div>
        <div class="history-list" id="historyList"></div>
      </aside>
    </div>
  </main>

  <dialog id="shortcutsModal" class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h2>Keyboard shortcuts</h2><button id="closeShortcutsModal" type="button" aria-label="Close">×</button></div>
      <div class="shortcut-grid">
        <span>0–9 · Numbers</span><span>+ − × ÷ · Operators</span>
        <span>Enter or = · Calculate</span><span>Backspace · Delete digit</span>
        <span>Escape or C · Clear</span><span>% · Percent</span>
        <span>H · Toggle history</span><span>S / O / T · sin / cos / tan</span>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
